name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  HOSTING_DOMAIN: nextsteps.rigchurchlagos.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Hostinger MCP server
        # Pinned: tool names changed in v2.1.0 (28 Sep 2026) and broke the deploy
        # silently. Bump on purpose, and update deploy.mjs if the names move again.
        run: npm install -g hostinger-api-mcp@2.13.0

      - name: Install app dependencies
        run: npm ci

      - name: Install deploy-tool dependencies
        run: npm install
        working-directory: .github/deploy-tool

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Package built site
        run: cd dist && zip -r /tmp/deploy.zip .

      - name: Start Hostinger MCP server
        run: |
          HOSTINGER_API_TOKEN="${{ secrets.HOSTINGER_API_TOKEN }}" \
            nohup hostinger-hosting-mcp --http --port 8100 > /tmp/mcp.log 2>&1 &
          ready=false
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8100/ || true)
            echo "attempt $i: http_code=$code"
            if [ "$code" != "000" ]; then
              echo "MCP server responding"
              ready=true
              break
            fi
            sleep 1
          done
          cat /tmp/mcp.log || true
          if [ "$ready" != "true" ]; then
            echo "::error::MCP server never became ready"
            exit 1
          fi

      - name: Deploy static site to Hostinger
        run: node .github/deploy-tool/deploy.mjs "$HOSTING_DOMAIN" /tmp/deploy.zip
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

      - name: Show MCP server log (on failure)
        if: failure()
        run: cat /tmp/mcp.log || true
